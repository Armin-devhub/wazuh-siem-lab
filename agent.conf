<agent_config>

  <!-- Centralized agent configuration pushed from the Wazuh manager to all
       agents in the "default" group. This is the fleet-management approach:
       configure once on the manager, every endpoint receives it. -->

  <!-- Collect Sysmon telemetry: process creation (Event ID 1), network
       connections (3), image loads (7), registry events (12-14), etc.
       This is the high-fidelity endpoint data real detections are built on. -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</agent_config>
